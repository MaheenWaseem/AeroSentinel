[project]
name = "nasa-cmapss-rul"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.30.0",
    "joblib>=1.6.0",
    "numpy",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true